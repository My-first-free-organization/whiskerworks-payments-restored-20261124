name: Docker image
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          printf 'FROM node:20-alpine\nWORKDIR /app\nCOPY . .\nCMD ["node","src/index.js"]\n' > Dockerfile.ci
          docker build -f Dockerfile.ci -t whiskerworks/payments:${{ github.sha }} .
